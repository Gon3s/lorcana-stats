version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: [patch]
      npm-minors:
        patterns: ["*"]
        update-types: [minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
